<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pseudo AR Plane</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { margin: 0; overflow: hidden; }
  video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    top: 0;
    left: 0;
    z-index: 0;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

let scene, camera, renderer;
let model = null;
let placed = false;

init();

async function init() {

  // 📷 камера
  const video = document.getElementById("video");
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;

  // 🎬 сцена
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.01,
    100
  );
  camera.position.z = 1;

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 💡 світло
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

  // 📦 модель
  const loader = new GLTFLoader();
  loader.load("ToyCar.glb", (gltf) => {
    model = gltf.scene;
    model.scale.set(0.5, 0.5, 0.5);
    model.visible = false;
    scene.add(model);
  });

  // 👆 тап по екрану = "площина"
  window.addEventListener("click", (e) => placeObject(e));

  animate();
}

function placeObject(event) {

  if (!model) return;

  // 📌 pseudo plane:
  // беремо центр екрану як "підлогу"
  const x = 0;
  const y = -0.5;   // "висота підлоги"
  const z = -2;     // відстань від камери

  model.position.set(x, y, z);
  model.visible = true;
  placed = true;
}

function animate() {
  requestAnimationFrame(animate);

  if (model && placed) {
    model.rotation.y += 0.01;
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
